# Upstream route config for capx/serving/llm_proxy_server.py.
#
# Each route is evaluated in order; the first route whose `prefix_match`
# or `model_match` matches the incoming `model` string handles the request.
# A route marked `default: true` is used as a fallback when no other route
# matches (only one route should be marked as default).
#
# Per-route key files are read on startup. If a key file is missing, that
# route is skipped with a warning so the proxy can still serve the
# providers whose keys are present.
#
# The optional `models` list provides display metadata for the web UI.
# Each entry has an `id` (the model name sent to the upstream) and a
# human-readable `label`.

routes:
  # OpenRouter (default fallback). Explicit "openrouter/" prefixed model
  # names are matched first and the prefix is stripped before forwarding.
  # Any model name that does not match a more specific route also falls
  # through here when this route is enabled.
  - name: openrouter
    prefix_match: "openrouter/"
    strip_prefix: "openrouter/"
    base_url: https://openrouter.ai/api/v1/
    key_file: .openrouterkey
    default: true
    default_headers:
      HTTP-Referer: https://github.com/nvidia-gear/CaP-X
      X-Title: CaP-X
    models:
      - id: google/gemini-3.1-pro-preview
        label: Gemini 3.1 Pro Preview
      - id: google/gemini-3.1-pro
        label: Gemini 3.1 Pro
      - id: google/gemini-2.5-flash-lite
        label: Gemini 2.5 Flash Lite
      - id: anthropic/claude-opus-4-5
        label: Claude Opus 4.5
      - id: anthropic/claude-sonnet-4
        label: Claude Sonnet 4
      - id: anthropic/claude-haiku-4-5
        label: Claude Haiku 4.5
      - id: openai/gpt-5.2
        label: GPT 5.2
      - id: openai/gpt-5.1
        label: GPT 5.1
      - id: openai/gpt-5.1-codex
        label: GPT 5.1 Codex
      - id: openai/o4-mini
        label: O4 Mini
      - id: openai/o1
        label: O1
      - id: deepseek/deepseek-v3-0324
        label: DeepSeek V3
      - id: deepseek/deepseek-r1-0528
        label: DeepSeek R1
      - id: qwen/qwen-235b-a22b
        label: Qwen 235B
      - id: moonshotai/kimi-k2-instruct
        label: Kimi K2

  # Qwen proxy (DashScope backend). The upstream proxy requires a
  # `backend: dashscope` field in the request body for these model names;
  # the proxy injects it by default and the caller can still override it
  # by sending an explicit `backend` value.
  - name: qwen-dashscope
    base_url: http://39.106.150.148:5018/v1/
    key_file: .qwenkey
    default_extra_body:
      backend: dashscope
    model_match:
      - qwen3.5-plus
      - qwen3.5-27b
      - qwen3.5-35b-a3b
      - qwen3.5-122b-a10b
      - qwen3.5-397b-a17b
      - qwen3-vl-235b-a22b-instruct
    models:
      - id: qwen3.5-plus
        label: Qwen3.5 Plus
      - id: qwen3.5-27b
        label: Qwen3.5 27B
      - id: qwen3.5-35b-a3b
        label: Qwen3.5 35B A3B
      - id: qwen3.5-122b-a10b
        label: Qwen3.5 122B A10B
      - id: qwen3.5-397b-a17b
        label: Qwen3.5 397B A17B
      - id: qwen3-vl-235b-a22b-instruct
        label: Qwen3 VL 235B A22B
